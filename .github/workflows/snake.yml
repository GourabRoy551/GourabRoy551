name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#8B5CF6&color_dots=#161A24,#2E1F5E,#4C2FA0,#7C4DFF,#22D3EE
            dist/snake-light.svg?color_snake=#8B5CF6&color_dots=#EEF0F4,#DDD3FD,#B9A3FB,#8B5CF6,#06B6D4

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
