<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="CerebralNet: Deep-learning system that detects major abnormalities in brain CT and MRI scans by combining segmentation and classification.">
<defs>
  <linearGradient id="acerebralnetdark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="scerebralnetdark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
  <clipPath id="ccerebralnetdark"><rect width="560" height="300" rx="16"/></clipPath>
</defs>
<style>
  @media (prefers-reduced-motion: no-preference) {
    .shcerebralnetdark { animation: shcerebralnetdark 7s ease-in-out 5.5s infinite; }
    .incerebralnetdark { animation: incerebralnetdark .8s cubic-bezier(.2,.7,.2,1) 0.40s both; }
  }
  @keyframes shcerebralnetdark { 0% { transform: translateX(-200px); } 60%,100% { transform: translateX(560px); } }
  @keyframes incerebralnetdark { from { opacity: 0; transform: translateY(10px); } }
</style>
<g clip-path="url(#ccerebralnetdark)">
