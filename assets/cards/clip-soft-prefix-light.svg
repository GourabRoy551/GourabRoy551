<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="CLIP Soft-Prefix Attribution: Learns a continuous soft prefix on frozen CLIP encoders for retrieval, then measures which caption tokens the prefix makes CLIP rely on.">
<defs>
  <linearGradient id="aclip-soft-prefixlight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="sclip-soft-prefixlight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
  <clipPath id="cclip-soft-prefixlight"><rect width="560" height="300" rx="16"/></clipPath>
</defs>
<style>
  @media (prefers-reduced-motion: no-preference) {
    .shclip-soft-prefixlight { animation: shclip-soft-prefixlight 7s ease-in-out 1.1s infinite; }
    .inclip-soft-prefixlight { animation: inclip-soft-prefixlight .8s cubic-bezier(.2,.7,.2,1) 0.08s both; }
  }
  @keyframes shclip-soft-prefixlight { 0% { transform: translateX(-200px); } 60%,100% { transform: translateX(560px); } }
  @keyframes inclip-soft-prefixlight { from { opacity: 0; transform: translateY(10px); } }
</style>
<g clip-path="url(#cclip-soft-prefixlight)">
