<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Cardiac Autonomic Assessment: Raw PPG to time- and frequency-domain HRV, testing how self-selected music shifts each subject's autonomic response.">
<defs>
  <linearGradient id="appg-hrvlight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="sppg-hrvlight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
  <clipPath id="cppg-hrvlight"><rect width="560" height="300" rx="16"/></clipPath>
</defs>
<style>
  @media (prefers-reduced-motion: no-preference) {
    .shppg-hrvlight { animation: shppg-hrvlight 7s ease-in-out 4.4s infinite; }
    .inppg-hrvlight { animation: inppg-hrvlight .8s cubic-bezier(.2,.7,.2,1) 0.32s both; }
  }
  @keyframes shppg-hrvlight { 0% { transform: translateX(-200px); } 60%,100% { transform: translateX(560px); } }
  @keyframes inppg-hrvlight { from { opacity: 0; transform: translateY(10px); } }
</style>
<g clip-path="url(#cppg-hrvlight)">
  <rect width="560" height="300" fill="#FAFAFB"/>
  <rect width="560" height="2" fill="url(#appg-hrvlight)" opacity=".55"/>
  <rect class="shppg-hrvlight" width="200" height="2" fill="url(#sppg-hrvlight)"/>
</g>
<rect x=".5" y=".5" width="559" height="299" rx="15.5" fill="none" stroke="#E5E7EB"/>
