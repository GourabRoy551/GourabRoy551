<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="SiteGuard AI: Five-class PPE detection for construction sites with worker-to-PPE matching. YOLO26n/s vs YOLOv8n, served with FastAPI and Docker.">
<defs>
  <linearGradient id="asiteguard-aidark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="ssiteguard-aidark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
  <clipPath id="csiteguard-aidark"><rect width="560" height="300" rx="16"/></clipPath>
</defs>
<style>
  @media (prefers-reduced-motion: no-preference) {
    .shsiteguard-aidark { animation: shsiteguard-aidark 7s ease-in-out 2.2s infinite; }
    .insiteguard-aidark { animation: insiteguard-aidark .8s cubic-bezier(.2,.7,.2,1) 0.16s both; }
  }
  @keyframes shsiteguard-aidark { 0% { transform: translateX(-200px); } 60%,100% { transform: translateX(560px); } }
  @keyframes insiteguard-aidark { from { opacity: 0; transform: translateY(10px); } }
</style>
